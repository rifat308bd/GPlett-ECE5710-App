<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECE4710/5710: Battery Dynamics</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔋</text></svg>">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="app-header">
      <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="header-title">
        <h1>ECE4710/5710</h1>
        <span class="header-subtitle">Modeling, Simulation, and Identification of Battery Dynamics</span>
      </div>
      <div class="header-actions">
        <button id="bookmarks-toggle" class="icon-btn" title="View bookmarks">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          <span class="badge" id="bookmark-count"></span>
        </button>
        <button id="theme-toggle" class="icon-btn" title="Toggle dark/light theme">
          <svg id="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg id="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </header>

    <!-- Sidebar overlay (mobile) -->
    <div id="sidebar-overlay"></div>

    <!-- Layout -->
    <div class="app-layout">
      <!-- Sidebar -->
      <aside id="sidebar">
        <div class="sidebar-search">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Search lectures..." autocomplete="off">
          <button id="search-clear" class="search-clear" title="Clear search">✕</button>
        </div>
        <div class="sidebar-filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="unwatched">Unwatched</button>
          <button class="filter-btn" data-filter="bookmarked">Bookmarked</button>
        </div>
        <nav id="chapter-nav"></nav>
        <div id="sidebar-stats" class="sidebar-stats"></div>
      </aside>

      <!-- Main content area -->
      <main id="main-content">
        <div id="welcome-view"></div>
        <div id="pdf-view" class="content-view" style="display:none">
          <div class="content-header">
            <div class="content-header-left">
              <h2 id="pdf-title" class="content-title"></h2>
            </div>
            <div class="content-actions">
              <button id="pdf-bookmark-btn" class="action-btn" title="Bookmark this PDF">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                <span>Bookmark</span>
              </button>
              <a id="pdf-download-link" class="action-btn" target="_blank" title="Open in new tab">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                <span>Open in New Tab</span>
              </a>
            </div>
          </div>
          <div class="pdf-container">
            <iframe id="pdf-frame" class="pdf-iframe"></iframe>
          </div>
        </div>

        <div id="video-view" class="content-view" style="display:none">
          <div class="content-header">
            <div class="content-header-left">
              <h2 id="video-title" class="content-title"></h2>
            </div>
            <div class="content-actions">
              <button id="video-watched-btn" class="action-btn" title="Mark as watched">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                <span>Watched</span>
              </button>
              <button id="video-bookmark-btn" class="action-btn" title="Bookmark this video">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                <span>Bookmark</span>
              </button>
            </div>
          </div>
          <div class="video-container">
            <video id="video-element" controls preload="metadata">
              Your browser does not support this video format.
            </video>
          </div>
          <div class="video-nav">
            <button id="prev-video" class="nav-btn" title="Previous lecture">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
              <span>Previous</span>
            </button>
            <a id="video-download-link" class="nav-btn download-btn" target="_blank" title="Download video">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span>Download</span>
            </a>
            <button id="next-video" class="nav-btn" title="Next lecture">
              <span>Next</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>

        <div id="bookmarks-view" class="content-view" style="display:none">
          <div class="content-header">
            <h2 class="content-title">📑 Your Bookmarks</h2>
          </div>
          <div id="bookmarks-list" class="bookmarks-list"></div>
        </div>
      </main>
    </div>

    <!-- Toast notifications -->
    <div id="toast-container"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
